<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marimba</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1a10;color:#f5e6cf;font-family:-apple-system,Helvetica,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
h1{margin:0;font-size:22px;letter-spacing:.5px}
.ctl{display:flex;gap:8px}
button{background:#5a3a22;color:#f5e6cf;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
#board{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 60px);bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;flex-direction:column;justify-content:center;padding:0 8px}
.row{position:relative;display:flex;gap:4px;height:44%}
.row.sharps{height:34%;margin-bottom:10px}
.bar{flex:1;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;font-weight:600;color:#3b2412;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 #120a05;transition:transform .05s,filter .05s}
.bar::before,.bar::after{content:"";position:absolute;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#2a1a10;opacity:.55}
.bar::before{top:14%}.bar::after{bottom:30%}
.nat{background:linear-gradient(90deg,#c98a4b,#e5a967 45%,#c48345)}
.sh{background:linear-gradient(90deg,#7a4a2a,#9a6238 45%,#74462a);color:#f5e6cf}
.gap{flex:1;visibility:hidden}
.bar.on{transform:translateY(3px) scale(.97);filter:brightness(1.25)}
footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);width:100%;text-align:center;font-size:12px;opacity:.6}
</style>
</head>
<body>
<header><h1>🎶 Marimba</h1><div class="ctl"><button id="down">◀ Oct</button><button id="up">Oct ▶</button></div></header>
<div id="board"><div class="row sharps" id="sharps"></div><div class="row" id="nats"></div></div>
<footer>Tap or slide across the bars · keys A–K on a keyboard</footer>
<script>
let ctx, master, octave = 4;
const NAT = ["C","D","E","F","G","A","B","C"], SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHARP_AFTER = [true,true,false,true,true,true,false];
function audio(){ if(ctx) return; ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createDynamicsCompressor(); const g = ctx.createGain(); g.gain.value = .9; master.connect(g); g.connect(ctx.destination);
  const verb = ctx.createConvolver(), len = ctx.sampleRate*1.4, b = ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  verb.buffer=b; const wet=ctx.createGain(); wet.gain.value=.18; master.connect(verb); verb.connect(wet); wet.connect(ctx.destination); }
function strike(freq){ audio(); if(ctx.state==="suspended") ctx.resume(); const t=ctx.currentTime;
  [[1,1,1.1],[3.93,.35,.35],[9.2,.12,.12],[.5,.15,.6]].forEach(([m,amp,dec])=>{ const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=freq*m; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp*.5,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+dec*(440/Math.max(freq,200))**.35); o.connect(g); g.connect(master); o.start(t); o.stop(t+2); });
  const n=ctx.createBufferSource(), nb=ctx.createBuffer(1,ctx.sampleRate*.02,ctx.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*(1-i/nd.length); n.buffer=nb; const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq*4;
  const ng=ctx.createGain(); ng.gain.value=.15; n.connect(f); f.connect(ng); ng.connect(master); n.start(t); }
const hz = midi => 440*Math.pow(2,(midi-69)/12);
function build(){ const nats=document.getElementById("nats"), sh=document.getElementById("sharps"); nats.innerHTML=""; sh.innerHTML="";
  NAT.forEach((n,i)=>{ const oct=octave+(i===7?1:0), midi=12*(oct+1)+SEMI[n];
    const b=document.createElement("div"); b.className="bar nat"; b.textContent=n+oct; b.dataset.midi=midi; nats.appendChild(b);
    if(i<7){ if(SHARP_AFTER[i]){ const s=document.createElement("div"); s.className="bar sh"; s.textContent=n+"♯"; s.dataset.midi=midi+1; sh.appendChild(s);} else { const g=document.createElement("div"); g.className="gap"; sh.appendChild(g);} } });
  const pad=document.createElement("div"); pad.className="gap"; pad.style.flex=".5"; sh.prepend(pad); }
function hit(el){ if(!el||!el.dataset.midi) return; strike(hz(+el.dataset.midi)); el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),120); }
const last=new Map();
function at(x,y){ const e=document.elementFromPoint(x,y); return e&&e.classList.contains("bar")?e:null; }
document.addEventListener("touchstart",e=>{ e.preventDefault(); for(const t of e.changedTouches){ const el=at(t.clientX,t.clientY); last.set(t.identifier,el); if(el) hit(el); } if(e.target.tagName==="BUTTON") e.target.click(); },{passive:false});
document.addEventListener("touchmove",e=>{ e.preventDefault(); for(const t of e.changedTouches){ const el=at(t.clientX,t.clientY); if(el!==last.get(t.identifier)){ last.set(t.identifier,el); if(el) hit(el);} } },{passive:false});
document.addEventListener("touchend",e=>{ for(const t of e.changedTouches) last.delete(t.identifier); });
let down=false; document.addEventListener("mousedown",e=>{ down=true; hit(at(e.clientX,e.clientY)); }); document.addEventListener("mouseup",()=>down=false);
let prev=null; document.addEventListener("mousemove",e=>{ if(!down) return; const el=at(e.clientX,e.clientY); if(el!==prev){prev=el; if(el) hit(el);} });
const KEYS="awsedftgyhujk"; document.addEventListener("keydown",e=>{ const i=KEYS.indexOf(e.key); if(i<0||e.repeat) return; const el=[...document.querySelectorAll(".bar")].find(b=>+b.dataset.midi===12*(octave+1)+i); hit(el); });
document.getElementById("up").onclick=()=>{ if(octave<6){octave++;build();} };
document.getElementById("down").onclick=()=>{ if(octave>2){octave--;build();} };
build();
</script>
</body>
</html>
